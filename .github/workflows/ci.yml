name: BLAS CI

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libopenblas-dev

      - name: Build benchmark
        run: |
          make

      - name: Run benchmark
        run: |
          ./benchmark
